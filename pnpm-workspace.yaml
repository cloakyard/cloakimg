packages:
  - "."

# Keep transitive tooling on maintained releases when upstream packages lag.
# `canvas` is an API-compatible alias used only by Node-side Fabric/jsdom code;
# the browser application continues to use the native Canvas APIs.
overrides:
  # Workbox minifier dependency: GHSA-m5mm-p8h7-m29v.
  serialize-javascript: ">=7.1.4"
  # Pinned node-resolve patch clones its fixed defaults with Node structuredClone.
  # Remove this override and patch when upstream drops deepmerge (GHSA-gcqx-w48m-w2h4).
  "@rollup/plugin-node-resolve@16.0.3>deepmerge": "-"
  adm-zip: 0.6.1
  canvas: npm:@napi-rs/canvas@1.0.13
  glob: 14.0.4
  jsdom: 31.0.0
  onnxruntime-node: 1.30.0
  sharp: 0.35.5
  vite@*: "catalog:"

# Vite+ is installed as a versioned Vite-compatible alias, and the canvas
# override is API-compatible but intentionally has its own package version.
peerDependencyRules:
  allowAny:
    - canvas
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  # Transformers.js ships this Node backend for server consumers; CloakIMG
  # uses only the browser/WebAssembly backend.
  onnxruntime-node: false
  # This dependency's postinstall is not required by the browser bundle.
  protobufjs: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0

patchedDependencies:
  "@rollup/plugin-node-resolve@16.0.3": patches/@rollup__plugin-node-resolve@16.0.3.patch
minimumReleaseAgeExclude:
  - "@vitejs/plugin-react@6.3.0"
