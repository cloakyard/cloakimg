<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CloakIMG social preview</title>
    <link rel="stylesheet" href="../src/styles/air.css" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--air-font);
        color: var(--air-ink);
        background: var(--air-page);
      }
      #stage {
        width: 1200px;
        height: 630px;
        padding: 48px;
        position: relative;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: -0.03em;
      }
      header img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 490px;
        gap: 32px;
        align-items: center;
        margin-top: 44px;
      }
      h1 {
        font-size: 72px;
        line-height: 1.04;
        letter-spacing: -0.06em;
        font-weight: 500;
        margin: 0 0 24px;
      }
      h1 span {
        color: var(--air-ink-secondary);
      }
      p {
        font-size: 22px;
        line-height: 1.5;
        color: var(--air-ink-secondary);
        max-width: 470px;
        margin: 0;
      }
      .photo {
        position: relative;
        width: 490px;
        height: 350px;
        border-radius: 20px;
        overflow: hidden;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .crop {
        position: absolute;
        inset: 30px 38px;
        border: 1px solid rgba(255, 255, 255, 0.7);
      }
      .crop i {
        position: absolute;
        width: 24px;
        height: 24px;
        border: solid var(--air-light-cloakimg);
      }
      .crop i:nth-child(1) {
        left: -1px;
        top: -1px;
        border-width: 2px 0 0 2px;
      }
      .crop i:nth-child(2) {
        right: -1px;
        top: -1px;
        border-width: 2px 2px 0 0;
      }
      .crop i:nth-child(3) {
        right: -1px;
        bottom: -1px;
        border-width: 0 2px 2px 0;
      }
      .crop i:nth-child(4) {
        left: -1px;
        bottom: -1px;
        border-width: 0 0 2px 2px;
      }
      footer {
        position: absolute;
        bottom: 42px;
        left: 48px;
        right: 48px;
        display: flex;
        justify-content: space-between;
        color: var(--air-ink-secondary);
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <header><img src="../public/icons/favicon.svg" alt="" />CloakIMG</header>
      <main>
        <div>
          <h1>Your photos.<br /><span>Your way.</span></h1>
          <p>Edit, compose and export with a complete photo toolkit, right on your device.</p>
        </div>
        <div class="photo">
          <img src="../public/artwork/orange.webp" alt="An orange framed for editing" />
          <div class="crop"><i></i><i></i><i></i><i></i></div>
        </div>
      </main>
      <footer><span>Private by design. Free to use.</span><span>img.cloakyard.com ↗</span></footer>
    </div>
  </body>
</html>
