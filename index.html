<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- SVG favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="mask-icon" href="/icons/favicon.svg" color="#f4512c" />

    <!-- Keep browser zoom available for accessibility. The editor
         canvas owns its gesture handling on the canvas surface only. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#170c07" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS / installable PWA -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CloakIMG" />

    <!-- SEO -->
    <meta
      name="description"
      content="CloakIMG is a complete browser-based photo workbench for crop, retouch, redact, colour, composition, and local export. Your image content stays in your browser."
    />
    <meta
      name="keywords"
      content="offline photo editor, browser image editor, private photo editor, no upload image editor, crop image, redact image, remove background, photo filter, image privacy"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://img.cloakyard.com/" />
    <meta
      property="og:title"
      content="CloakIMG — A complete photo workbench. Your pixels stay put."
    />
    <meta
      property="og:description"
      content="Crop, retouch, redact, grade, compose, and export in one capable browser app."
    />
    <meta property="og:site_name" content="CloakIMG" />
    <!-- PNG first for crawlers that don't render SVG (Twitter, LinkedIn, Slack…) -->
    <meta property="og:image" content="https://img.cloakyard.com/icons/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CloakIMG — A complete private photo workbench" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CloakIMG — A complete photo workbench" />
    <meta
      name="twitter:description"
      content="Crop, retouch, redact, grade, compose, and export while your image content stays in your browser."
    />
    <meta name="twitter:image" content="https://img.cloakyard.com/icons/og-image.png" />

    <title>CloakIMG — A complete photo workbench</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
