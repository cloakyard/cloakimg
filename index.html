<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="/src/styles/air.css" />
    <link rel="stylesheet" href="/src/styles/air-entry.css" />

    <!-- SVG favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="mask-icon" href="/icons/favicon.svg" color="#f4512c" />

    <!-- Keep browser zoom available for accessibility. The editor
         canvas owns its gesture handling on the canvas surface only. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafbfc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101216" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS / installable PWA -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CloakIMG" />

    <!-- SEO -->
    <meta
      name="description"
      content="CloakIMG is a private browser photo workbench for editing, background replacement, and exact passport or visa photo print sheets. Your image content stays in your browser."
    />
    <meta
      name="keywords"
      content="offline photo editor, browser image editor, private photo editor, passport photo maker, visa photo size, passport photo print sheet, remove background, image privacy"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://img.cloakyard.com/" />
    <meta property="og:title" content="CloakIMG — Your photos. Your way." />
    <meta
      property="og:description"
      content="Edit photos, replace backgrounds, and make exact passport or visa print sheets in one private browser app."
    />
    <meta property="og:site_name" content="CloakIMG" />
    <!-- PNG first for crawlers that don't render SVG (Twitter, LinkedIn, Slack…) -->
    <meta property="og:image" content="https://img.cloakyard.com/icons/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CloakIMG — A complete private photo workbench" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CloakIMG — Your photos. Your way." />
    <meta
      name="twitter:description"
      content="Edit photos, replace backgrounds, and make passport or visa print sheets while image content stays in your browser."
    />
    <meta name="twitter:image" content="https://img.cloakyard.com/icons/og-image.png" />

    <title>CloakIMG — Your photos. Your way.</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <style>
        body {
          margin: 0;
        }
      </style>
      <main class="img-site">
        <div class="img-page-width img-section img-reading">
          <a class="img-brand" href="/" aria-label="CloakIMG home"
            ><img src="/cloakimg-mark.svg" width="36" height="36" alt="" />CloakIMG</a
          >
          <h1>Your photos. Your way.</h1>
          <p>
            Enable JavaScript to edit photos in this browser. Editing and export happen on your
            device; your images are not uploaded.
          </p>
          <p>
            Optional AI models download with your permission. Recent files and a working draft can
            be retained in this browser and removed through its site-data controls.
          </p>
          <p>
            <a href="https://github.com/cloakyard/cloakimg">Read the source</a> or
            <a href="https://cloakyard.com">explore Cloakyard</a>.
          </p>
        </div>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
