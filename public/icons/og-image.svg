  <text class="og-display" x="163" y="96" fill="var(--og-ink)" font-size="38" letter-spacing="-1.6">Cloak<tspan fill="var(--og-accent-bright)">IMG</tspan></text>
  <text class="og-mono" x="1134" y="86" text-anchor="end" fill="var(--og-ink-2)" font-size="13" letter-spacing="1.5">CLOAKYARD / PHOTO WORKBENCH</text>

  <line x1="66" y1="134" x2="1134" y2="134" stroke="var(--og-rule)"/>

  <text class="og-display" x="66" y="239" fill="var(--og-ink)" font-size="68" letter-spacing="-2.8">
    A complete photo
  </text>
  <text class="og-display" x="66" y="313" fill="var(--og-ink)" font-size="68" letter-spacing="-2.8">
    workbench.
  </text>
  <text class="og-display" x="66" y="387" fill="var(--og-accent)" font-size="68" letter-spacing="-2.8">
    Your pixels stay put.
  </text>
  <text class="og-mono" x="68" y="443" fill="var(--og-ink-2)" font-size="12" letter-spacing="1.15">CROP · RETOUCH · REDACT · GRADE · EXPORT</text>

