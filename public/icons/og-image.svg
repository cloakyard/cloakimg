<!-- Hallmark · asset: Open Graph · genre: modern-minimal · theme: studied-DNA (CloakPDF) · tone: technical-editorial · anchor: Signal Coral -->
<!-- Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V4 · slop: pass (69/69) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">CloakIMG — a complete private photo workbench</title>
  <desc id="description">CloakIMG brand mark, a privacy statement, and a coastal image framed with functional editing metadata.</desc>
  <defs>
    <style>
      :root {
        --og-paper: #faf8f5;
        --og-paper-2: #f7f3ee;
        --og-surface: #fffdfb;
        --og-ink: #201b17;
        --og-ink-2: #6b655d;
        --og-rule: #d8d0c7;
        --og-rule-strong: #bdb4aa;
        --og-accent: #cb421e;
        --og-accent-bright: #f4512c;
        --og-accent-soft: #ffd6c8;
        --og-night: #201d1a;
        --og-night-ink: #faf8f5;
        --og-night-muted: #bfb9b1;
        --og-sky-top: #7d9fc0;
        --og-sky-bottom: #efc79f;
        --og-ridge-far: #6f6570;
        --og-ridge-near: #3d3c47;
        --og-water-top: #516f79;
        --og-water-bottom: #162e35;
        --og-foreground: #15272b;
        --og-mark-highlight: #ff9a76;
        --og-mark-mid: #f4512c;
        --og-mark-shadow: #c83217;
      }
      .og-display { font-family: "Archivo", "Arial Narrow", sans-serif; font-weight: 800; }
      .og-mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 700; }
    </style>
    <linearGradient id="mark-fill" x1="11" y1="6" x2="51" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--og-mark-highlight)"/>
      <stop offset=".45" stop-color="var(--og-mark-mid)"/>
      <stop offset="1" stop-color="var(--og-mark-shadow)"/>
    </linearGradient>
    <radialGradient id="mark-light" cx="0" cy="0" r="1" gradientTransform="translate(20 13) rotate(48) scale(35)">
      <stop stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".58" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scene-sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="var(--og-sky-top)"/>
      <stop offset="1" stop-color="var(--og-sky-bottom)"/>
    </linearGradient>
    <linearGradient id="scene-water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="var(--og-water-top)"/>
      <stop offset="1" stop-color="var(--og-water-bottom)"/>
    </linearGradient>
    <radialGradient id="scene-sun">
      <stop stop-color="#fff5d6"/>
      <stop offset=".45" stop-color="#ffe0b5" stop-opacity=".76"/>
      <stop offset="1" stop-color="#ffe0b5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scene-clip">
      <rect x="700" y="178" width="434" height="292" rx="8"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="var(--og-paper)"/>
  <path d="M0 0h1200v8H0z" fill="var(--og-accent)"/>

  <g transform="translate(66 43) scale(1.25)">
    <circle cx="32" cy="32" r="30" fill="url(#mark-fill)"/>
    <circle cx="32" cy="32" r="29.25" fill="url(#mark-light)" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
    <g stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="15.5" y="17.5" width="33" height="29" rx="4"/>
      <circle cx="39.5" cy="26" r="2.75"/>
      <path d="m20 41 8.2-9 6.1 6.1 5.7-7.3 8.5 10.2"/>
    </g>
