    <text class="og-mono" x="1134" y="162" text-anchor="end" fill="var(--og-accent)" font-size="11" letter-spacing=".9">READY</text>

    <g clip-path="url(#scene-clip)">
      <rect x="700" y="178" width="434" height="292" fill="url(#scene-sky)"/>
      <circle cx="1033" cy="252" r="68" fill="url(#scene-sun)"/>
      <path d="M700 365C752 321 798 337 845 284C885 240 921 344 970 323C1021 301 1064 342 1134 307V401H700Z" fill="var(--og-ridge-far)"/>
      <path d="M700 393C755 354 793 398 850 341C903 288 925 397 981 359C1033 324 1077 395 1134 354V420H700Z" fill="var(--og-ridge-near)"/>
      <rect x="700" y="385" width="434" height="85" fill="url(#scene-water)"/>
      <path d="M700 443C763 421 805 453 867 433C930 412 984 457 1047 428C1080 413 1105 419 1134 407V470H700Z" fill="var(--og-foreground)"/>
      <g fill="none" stroke="#f5d2ac" stroke-opacity=".38" stroke-width="1.5">
        <path d="M1002 391h58"/>
        <path d="M994 400h76"/>
        <path d="M983 410h98"/>
        <path d="M972 422h120"/>
      </g>
      <path d="M720 199h34M720 199v34M1114 199h-34M1114 199v34M720 449h34M720 449v-34M1114 449h-34M1114 449v-34" fill="none" stroke="var(--og-night-ink)" stroke-width="2"/>
      <rect x="700" y="429" width="434" height="41" fill="var(--og-night)" fill-opacity=".92"/>
      <circle cx="719" cy="449.5" r="4" fill="var(--og-accent-bright)"/>
      <text class="og-mono" x="732" y="454" fill="var(--og-night-ink)" font-size="10" letter-spacing=".8">ADJUST / EXPOSURE +08 / WARMTH −04</text>
      <text class="og-mono" x="1116" y="454" text-anchor="end" fill="var(--og-night-muted)" font-size="9">LOCAL</text>
    </g>
    <rect x="700" y="178" width="434" height="292" rx="8" fill="none" stroke="var(--og-rule-strong)" stroke-width="2"/>
  </g>

  <line x1="66" y1="526" x2="1134" y2="526" stroke="var(--og-rule)"/>
  <g class="og-mono" fill="var(--og-ink)" font-size="13" letter-spacing=".7">
    <text x="66" y="565">25 EDITOR TOOLS</text>
    <text x="310" y="565">5 EXPORT FORMATS</text>
    <text x="565" y="565">0 IMAGE UPLOADS</text>
    <text x="804" y="565">ON-DEVICE AI</text>
  </g>
  <text class="og-mono" x="1134" y="565" text-anchor="end" fill="var(--og-accent)" font-size="13">IMG.CLOAKYARD.COM</text>
</svg>
