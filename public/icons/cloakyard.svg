<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description" data-logo-spec="cloakyard-mark-v2">
  <title id="title">Cloakyard</title>
  <desc id="description">The landing animation’s settled blue cubes and open next cell on an indigo disc.</desc>
  <defs>
    <linearGradient id="enamel" x1=".19" y1="0" x2=".75" y2="1">
      <stop id="enamel-light" stop-color="#96baff"/>
      <stop id="enamel-mid" offset=".47" stop-color="#4569d6"/>
      <stop id="enamel-deep" offset="1" stop-color="#263fa4"/>
    </linearGradient>
    <linearGradient id="rim" x1=".24" y1="0" x2=".76" y2="1">
      <stop stop-color="#fff" stop-opacity=".88"/>
      <stop offset=".39" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".7" stop-color="#0a1540" stop-opacity=".24"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".46"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".24" cy=".16" r=".8">
      <stop stop-color="#fff" stop-opacity=".27"/>
      <stop offset=".68" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <symbol id="solid" viewBox="-49 -1 98 106" overflow="visible" stroke-linejoin="round" stroke-width="1">
      <path id="solid-0" d="M-48 24 0 48V104L-48 80Z" fill="#709cf9" stroke="#c0d3fc"/>
      <path id="solid-1" d="M0 48 48 24V80L0 104Z" fill="#376ee6" stroke="#c0d3fc"/>
      <path id="solid-2" d="M0 0 48 24 0 48-48 24Z" fill="#dfe9fe" stroke="#c0d3fc"/>
    </symbol>
    <symbol id="open" viewBox="-49 -1 98 106" overflow="visible" stroke-linejoin="round" stroke-width="1">
      <path id="open-0" d="M-48 24 0 48V104L-48 80Z" fill="#f4f7fc" stroke="#c4d5fa"/>
      <path id="open-1" d="M0 48 48 24V80L0 104Z" fill="#f4f7fc" stroke="#c4d5fa"/>
      <path id="open-2" d="M0 0 48 24 0 48-48 24Z" fill="#f4f7fc" stroke="#c4d5fa"/>
    </symbol>
    <style>
      @media (prefers-color-scheme: dark) {
        #enamel-light { stop-color: #6b89cd }
        #enamel-mid { stop-color: #364c91 }
        #enamel-deep { stop-color: #23316b }
        #solid-0 { fill: #5795c1; stroke: #355269 }
        #solid-1 { fill: #79c7fe; stroke: #355269 }
        #solid-2 { fill: #283846; stroke: #355269 }
        #open-0 { fill: #13171d; stroke: #2b4457 }
        #open-1 { fill: #13171d; stroke: #2b4457 }
        #open-2 { fill: #13171d; stroke: #2b4457 }
      }
    </style>
  </defs>
  <g id="disc">
    <circle cx="32" cy="32" r="30" fill="url(#enamel)"/>
    <circle cx="32" cy="32" r="29.5" fill="url(#bloom)" stroke="url(#rim)" stroke-width="1"/>
  </g>
  <g id="artwork">
    <use href="#solid" x="23.17" y="23.17" width="17.66" height="19.132"/>
    <use href="#solid" x="13.972" y="27.769" width="17.66" height="19.132"/>
    <use href="#solid" x="32.368" y="27.769" width="17.66" height="19.132"/>
    <use href="#solid" x="23.17" y="32.368" width="17.66" height="19.132"/>
    <use href="#solid" x="23.17" y="12.5" width="17.66" height="19.132"/>
    <use href="#solid" x="13.972" y="17.099" width="17.66" height="19.132"/>
    <use href="#open" x="32.368" y="17.099" width="17.66" height="19.132"/>
  </g>
</svg>
