<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description" data-logo-spec="cloakyard-mark-v2">
  <title id="title">CloakIMG</title>
  <desc id="description">A warm white picture frame holds two overlapping coral ridges beneath a small raised sun.</desc>
  <defs>
    <linearGradient id="enamel" x1=".19" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#ffae85"/>
      <stop offset=".47" stop-color="#f46742"/>
      <stop offset="1" stop-color="#c64025"/>
    </linearGradient>
    <linearGradient id="rim" x1=".24" y1="0" x2=".76" y2="1">
      <stop stop-color="#fff" stop-opacity=".88"/>
      <stop offset=".39" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".7" stop-color="#0a1540" stop-opacity=".24"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".46"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".24" cy=".16" r=".8">
      <stop stop-color="#fff" stop-opacity=".27"/>
      <stop offset=".68" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="contact" filterUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <feGaussianBlur stdDeviation="1.05"/>
    </filter>
    <rect id="mount" x="15.5" y="17.5" width="33" height="29" rx="4"/>
    <rect id="window" x="16.7" y="18.7" width="30.6" height="26.6" rx="2.95"/>
    <clipPath id="inside">
      <use href="#window"/>
    </clipPath>
    <linearGradient id="rim-paper" x2=".74" y2="1">
      <stop stop-color="#fff8ea"/>
      <stop offset=".48" stop-color="#fff3df"/>
      <stop offset="1" stop-color="#f0c6ad"/>
    </linearGradient>
    <linearGradient id="sky" x1=".3" y1="0" x2=".65" y2="1">
      <stop stop-color="#ee815f"/>
      <stop offset=".6" stop-color="#ffb78d"/>
      <stop offset="1" stop-color="#ffdfb3"/>
    </linearGradient>
    <linearGradient id="range" x1=".25" y1="0" x2=".8" y2="1">
      <stop stop-color="#f28e69"/>
      <stop offset="1" stop-color="#c9553c"/>
    </linearGradient>
    <linearGradient id="near" x2=".9" y2="1">
      <stop stop-color="#d26446"/>
      <stop offset=".72" stop-color="#aa4332"/>
      <stop offset="1" stop-color="#86392e"/>
    </linearGradient>
    <radialGradient id="sunlight" cx=".32" cy=".24" r=".85">
      <stop stop-color="#fffceb"/>
      <stop offset=".7" stop-color="#ffebbc"/>
      <stop offset="1" stop-color="#ffc88c"/>
    </radialGradient>
    <style>
      @media (prefers-color-scheme: dark) {
        [stop-color="#ffae85"] { stop-color: #ad624f }
        [stop-color="#f46742"] { stop-color: #933d2c }
        [stop-color="#c64025"] { stop-color: #642d29 }
      }
    </style>
  </defs>
  <g id="ground">
    <circle cx="32" cy="32" r="30" fill="url(#enamel)"/>
    <circle cx="32" cy="32" r="29.5" fill="url(#bloom)" stroke="url(#rim)" stroke-width="1"/>
  </g>
  <g id="artwork">
    <g id="frame">
      <use href="#mount" transform="translate(.45 1.65)" fill="#852e20" opacity=".56" filter="url(#contact)"/>
      <use href="#mount" transform="translate(.28 .75)" fill="#bd7356" stroke="#d29a7c" stroke-width="2.4"/>
      <use href="#mount" fill="url(#rim-paper)" stroke="url(#rim-paper)" stroke-width="2.15"/>
      <use href="#window" fill="url(#sky)" stroke="#c77f63" stroke-width=".4"/>
    </g>
    <g id="ridgelines">
      <g clip-path="url(#inside)" stroke-linejoin="round">
        <path d="m26.1 47.7 13.1-16.1q.75-.9 1.44.02l9.4 11.4v5Z" fill="url(#range)"/>
        <path d="m40.05 31.28 2.24 7.2 6.8 7.4V42Z" fill="#b6523e" opacity=".68"/>
        <path d="m14.8 47 12.76-14.41q.61-.77 1.32-.06l14 13.77v2Z" fill="url(#near)"/>
        <path d="m28.13 32.47 3.52 7.52 8 6.65h3.44Z" fill="#863b31" opacity=".57"/>
        <path d="m16.6 45.47 10.96-12.88q.61-.77 1.32-.06l5.45 5.47m.05-.15 4.82-6.25q.75-.9 1.44.02l6.66 8" fill="none" stroke="#ffe3bb" stroke-opacity=".86" stroke-width=".62" stroke-linecap="round"/>
      </g>
    </g>
    <g id="sun">
      <circle cx="39.72" cy="26.42" r="3.08" fill="#ba654c" opacity=".62"/>
      <circle cx="39.5" cy="26" r="3.06" fill="url(#sunlight)" stroke="#fff4d7" stroke-width=".55"/>
    </g>
  </g>
</svg>
